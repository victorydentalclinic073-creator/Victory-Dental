services:
  - type: web
    runtime: docker
    name: victory-dental-clinic
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: victory-dental-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@victorydental.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: TOKEN_HOURS
        value: "12"
      - key: CORS_ORIGINS
        value: ""
databases:
  - name: victory-dental-db
    plan: free
